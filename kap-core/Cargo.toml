[package]
name = "kap-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-complex = "0.4"
thiserror = "2"
unicode-segmentation = "1"
libm = "0.2"
regex = "1"
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
rand = "0.8"
# Native extension registry (kap-ext-* crates) — compile-time collection
inventory = "0.3"
# Real-JNI bridge (Tier-3, jvmbridge.rs): `invocation` starts the JVM
# in-process. libjvm loads at RUNTIME (dlopen via JAVA_HOME/PATH discovery),
# so the binary still runs with no JVM present (Tier-2 nominal fallback).
jni = { version = "0.21", features = ["invocation"] }

[dev-dependencies]
serde_json = "1"
